# Musk Systems — daily edition
# Runs every day at 07:47 KST (22:47 UTC), right away on every push to main, and on demand (Run workflow).
#   1) engine     node scripts/update.mjs             always — collects, ranks, rebuilds the site
#   2) /goal      Claude Code runs the /goal command   only if the ANTHROPIC_API_KEY secret exists
#   3) verify     the edition must be fresh and ASP/IIS-safe
#   4) commit     the new edition is saved back to the repository
#   5) publish    GitHub Pages (job "pages") — always; no FTP, no upload step that can be refused
#                 optional extra: FTP mirror only if DEPLOY_TARGET=ftp (never fails the run)
#   6) alert      opens a GitHub issue if the edition itself failed
name: Daily Musk news update
on:
  schedule:
    - cron: "47 22 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md", "SETUP.html"]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency: { group: daily-update, cancel-in-progress: false }
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_FTP: ${{ vars.DEPLOY_TARGET == 'ftp' && secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }

      - name: 1 · Collect and rebuild (news engine)
        id: engine
        continue-on-error: true
        run: node scripts/update.mjs

      - name: 2 · /goal — AI editor pass (optional)
        if: env.HAS_CLAUDE == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code -p "/goal" \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node scripts/update.mjs*),Bash(node -e*)" \
            --max-turns 40

      - name: 3 · Verify edition
        id: verify
        run: |
          node -e "
            const s=require('./data/status.json'), n=require('./data/news.json');
            const ageH=(Date.now()-new Date(s.lastRun))/36e5;
            console.log('status',JSON.stringify(s));
            if(!n.items||!n.items.length) throw new Error('news.json is empty');
            if(ageH>2) throw new Error('status.json was not refreshed this run');
          "
          grep -q "NEWS FEED UPDATED $(date -u +%F)" index.html
          if grep -q '<%\|%>' index.html; then echo 'ASP delimiter found in index.html'; exit 1; fi

      - name: 4 · Commit the new edition
        run: |
          git config user.name "musk-systems-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily edition $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push

      # 5a · FTP — your own web host (IIS or Apache)
      # IIS servers with "FTP virtual host names" reject a plain username with
      # "530 User cannot log in, home directory inaccessible"; they expect "hostname|username".
      # This step tries the username as entered, then the IIS form, and passes the one that works on.
      - name: 5 · FTP login check (optional mirror)
        id: ftpcheck
        if: env.HAS_FTP == 'true'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          host="${FTP_SERVER#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          try() { curl -sS --ftp-pasv --connect-timeout 20 --max-time 40 -u "$1:$FTP_PASSWORD" "ftp://$host/" -l -o /dev/null 2>/tmp/ftp.err; }
          if try "$FTP_USERNAME"; then echo "user=$FTP_USERNAME" >> "$GITHUB_OUTPUT"; echo "FTP login OK (username as entered)"; exit 0; fi
          first="$(cat /tmp/ftp.err)"; echo "Plain username: $first"
          case "$FTP_USERNAME" in *"|"*) ;; *)
            if try "$host|$FTP_USERNAME"; then echo "user=$host|$FTP_USERNAME" >> "$GITHUB_OUTPUT"; echo "::notice title=FTP::Logged in with the IIS form host|username"; exit 0; fi
            echo "IIS form host|username: $(cat /tmp/ftp.err)";;
          esac
          echo "::error title=FTP login refused::$first — Check FTP_SERVER (host only, no ftp://), FTP_USERNAME and FTP_PASSWORD. On IIS, set FTP_USERNAME to 'yourdomain.com|username' exactly as your FTP program uses it. The edition itself was built and saved."
          exit 1

      - name: 5 · Deploy over FTP (optional mirror)
        if: env.HAS_FTP == 'true' && steps.ftpcheck.outcome == 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftpcheck.outputs.host }}
          username: ${{ steps.ftpcheck.outputs.user }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            scripts/**
            README.md
            SETUP.html
            site.config.json
            render.js
            script.js

      - name: Run summary
        if: always()
        run: |
          {
            echo "## Musk Systems — edition $(date -u +%F)"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| News engine | ${{ steps.engine.outcome }} |"
            echo "| /goal editor | $([ "$HAS_CLAUDE" = true ] && echo ran || echo 'not set up (optional)') |"
            echo "| Verify | ${{ steps.verify.outcome }} |"
            echo "| Publish | GitHub Pages (next job) |"
            echo "| FTP mirror | $([ "$HAS_FTP" = true ] && echo "login ${{ steps.ftpcheck.conclusion }} (optional)" || echo 'off') |"
            echo ""
            node -e "const s=require('./data/status.json');console.log('Stories: '+s.totalItems+' ('+s.newItems+' new) · sources OK: '+s.sourcesOk+'/'+s.sourcesTotal+' · next run: '+s.nextRun)" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 6 · Alert on problems
        if: failure() || steps.engine.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --title "Daily edition problem $(date -u +%F)" \
            --body "The daily Musk Systems edition did not complete cleanly. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The site keeps showing the previous edition, and visitors' browsers switch to live mode after 26 hours." || true

  # GitHub Pages — publishes the edition that job "edition" just saved. No FTP, nothing for a host to refuse.
  # One-time setup in the repository: Settings → Pages → Source: "GitHub Actions" (+ custom domain). See SETUP.html.
  pages:
    needs: edition
    if: always() && needs.edition.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stage public files only
        run: |
          mkdir _site
          cp -r index.html styles.css assets data news feed.xml sitemap.xml robots.txt llms.txt llms-full.txt _site/
          touch _site/.nojekyll
          cp index.html _site/404.html
          host=$(node -e "try{const u=new URL(process.env.SITE_URL);if(!/github\.io$/.test(u.hostname))console.log(u.hostname)}catch(e){}")
          if [ -n "$host" ]; then echo "$host" > _site/CNAME; echo "Custom domain: $host"; fi
          du -sh _site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Pages not switched on yet?
        if: failure()
        run: echo "::error title=GitHub Pages is off::Open Settings → Pages and set Source to 'GitHub Actions' (see SETUP.html), then run the workflow again. The edition itself was built and saved."
